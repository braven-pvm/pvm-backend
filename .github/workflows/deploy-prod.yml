name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY PRODUCTION to continue"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-pvm-integrations-prod
  AZURE_LOCATION: southafricanorth
  ACR_NAME: acrpvmintegrationsprod
  ACR_LOGIN_SERVER: acrpvmintegrationsprod.azurecr.io
  KEY_VAULT_NAME: kv-pvm-intg-prod
  API_IMAGE: pvm-api
  WORKBENCH_IMAGE: pvm-workbench
  WORKER_IMAGE: pvm-worker

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Confirm the deployment target
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY PRODUCTION" ]; then
            echo "Type DEPLOY PRODUCTION to run this workflow." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/workbench/package-lock.json

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify backend
        run: dotnet test backend/Pvm.sln --configuration Release

      - name: Verify workbench
        working-directory: frontend/workbench
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Resolve deployment values
        id: values
        shell: bash
        run: |
          set -euo pipefail
          image_tag="prod-${GITHUB_SHA::12}"
          postgres_password="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name postgres--adminpassword --query value -o tsv)"
          auth_tenant_id="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name auth--tenantid --query value -o tsv)"
          auth_api_client_id="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name auth--api-clientid --query value -o tsv)"
          auth_workbench_client_id="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name auth--workbench-clientid --query value -o tsv)"
          auth_workbench_client_secret="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name auth--workbench-clientsecret --query value -o tsv)"
          auth_api_scope="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name auth--apiscope --query value -o tsv)"
          auth_nextauth_secret="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name auth--nextauthsecret --query value -o tsv)"
          auth_bootstrap_admin_email="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name auth--bootstrapadminemails --query value -o tsv)"
          auth_bootstrap_admin_object_id="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name auth--bootstrapadminobjectids --query value -o tsv)"
          shoprite_base_url="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name shoprite--baseurl --query value -o tsv)"
          shoprite_username="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name shoprite--username --query value -o tsv)"
          shoprite_password="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name shoprite--password --query value -o tsv)"
          shoprite_contract_id="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name shoprite--contractid --query value -o tsv)"
          acumatica_username="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name acumatica--username --query value -o tsv 2>/dev/null || true)"
          acumatica_password="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name acumatica--password --query value -o tsv 2>/dev/null || true)"
          acumatica_webhook_secret="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name acumatica--webhooksecret --query value -o tsv 2>/dev/null || true)"

          if [ -z "$postgres_password" ]; then
            echo "Key Vault secret postgres--adminpassword is missing." >&2
            exit 1
          fi

          required_values=(
            "auth_tenant_id"
            "auth_api_client_id"
            "auth_workbench_client_id"
            "auth_workbench_client_secret"
            "auth_api_scope"
            "auth_nextauth_secret"
            "auth_bootstrap_admin_email"
            "auth_bootstrap_admin_object_id"
            "shoprite_base_url"
            "shoprite_username"
            "shoprite_password"
            "shoprite_contract_id"
            "acumatica_username"
            "acumatica_password"
            "acumatica_webhook_secret"
          )
          for value_name in "${required_values[@]}"; do
            if [ -z "${!value_name}" ]; then
              echo "Missing required auth deployment value: $value_name" >&2
              exit 1
            fi
          done

          echo "::add-mask::$postgres_password"
          echo "::add-mask::$auth_workbench_client_secret"
          echo "::add-mask::$auth_nextauth_secret"
          echo "::add-mask::$shoprite_username"
          echo "::add-mask::$shoprite_password"
          echo "::add-mask::$shoprite_contract_id"
          if [ -n "$acumatica_username" ]; then echo "::add-mask::$acumatica_username"; fi
          if [ -n "$acumatica_password" ]; then echo "::add-mask::$acumatica_password"; fi
          if [ -n "$acumatica_webhook_secret" ]; then echo "::add-mask::$acumatica_webhook_secret"; fi

          {
            echo "image_tag=$image_tag"
            echo "postgres_password<<EOF"
            echo "$postgres_password"
            echo "EOF"
            echo "auth_tenant_id=$auth_tenant_id"
            echo "auth_api_client_id=$auth_api_client_id"
            echo "auth_workbench_client_id=$auth_workbench_client_id"
            echo "auth_workbench_client_secret<<EOF"
            echo "$auth_workbench_client_secret"
            echo "EOF"
            echo "auth_api_scope=$auth_api_scope"
            echo "auth_nextauth_secret<<EOF"
            echo "$auth_nextauth_secret"
            echo "EOF"
            echo "auth_bootstrap_admin_email=$auth_bootstrap_admin_email"
            echo "auth_bootstrap_admin_object_id=$auth_bootstrap_admin_object_id"
            echo "shoprite_base_url=$shoprite_base_url"
            echo "shoprite_username<<EOF"
            echo "$shoprite_username"
            echo "EOF"
            echo "shoprite_password<<EOF"
            echo "$shoprite_password"
            echo "EOF"
            echo "shoprite_contract_id<<EOF"
            echo "$shoprite_contract_id"
            echo "EOF"
            echo "acumatica_username<<EOF"
            echo "$acumatica_username"
            echo "EOF"
            echo "acumatica_password<<EOF"
            echo "$acumatica_password"
            echo "EOF"
            echo "acumatica_webhook_secret<<EOF"
            echo "$acumatica_webhook_secret"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure the container registry exists
        run: |
          set -euo pipefail
          if ! az acr show --name "$ACR_NAME" --only-show-errors >/dev/null 2>&1; then
            az group create --name "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION" --only-show-errors >/dev/null
            az acr create --name "$ACR_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --location westeurope --sku Basic --only-show-errors >/dev/null
          fi

      - name: Build and push API image
        run: |
          az acr login --name "$ACR_NAME"
          docker build \
            -t "$ACR_LOGIN_SERVER/$API_IMAGE:${{ steps.values.outputs.image_tag }}" \
            -t "$ACR_LOGIN_SERVER/$API_IMAGE:prod-latest" \
            -f backend/src/Pvm.Api/Dockerfile .
          docker push "$ACR_LOGIN_SERVER/$API_IMAGE:${{ steps.values.outputs.image_tag }}"
          docker push "$ACR_LOGIN_SERVER/$API_IMAGE:prod-latest"

      - name: Build and push workbench image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$WORKBENCH_IMAGE:${{ steps.values.outputs.image_tag }}" \
            -t "$ACR_LOGIN_SERVER/$WORKBENCH_IMAGE:prod-latest" \
            -f frontend/workbench/Dockerfile frontend/workbench
          docker push "$ACR_LOGIN_SERVER/$WORKBENCH_IMAGE:${{ steps.values.outputs.image_tag }}"
          docker push "$ACR_LOGIN_SERVER/$WORKBENCH_IMAGE:prod-latest"

      - name: Build and push worker image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$WORKER_IMAGE:${{ steps.values.outputs.image_tag }}" \
            -t "$ACR_LOGIN_SERVER/$WORKER_IMAGE:prod-latest" \
            -f backend/src/Pvm.Worker/Dockerfile .
          docker push "$ACR_LOGIN_SERVER/$WORKER_IMAGE:${{ steps.values.outputs.image_tag }}"
          docker push "$ACR_LOGIN_SERVER/$WORKER_IMAGE:prod-latest"

      - name: Deploy Bicep
        run: |
          az deployment sub create \
            --name "pvm-integrations-prod-${{ github.run_number }}" \
            --location "$AZURE_LOCATION" \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/main.parameters.prod.json \
            --parameters postgresAdminPassword='${{ steps.values.outputs.postgres_password }}' \
            --parameters apiImageTag='${{ steps.values.outputs.image_tag }}' \
            --parameters workbenchImageTag='${{ steps.values.outputs.image_tag }}' \
            --parameters workerImageTag='${{ steps.values.outputs.image_tag }}' \
            --parameters authMode=Entra \
            --parameters authTenantId='${{ steps.values.outputs.auth_tenant_id }}' \
            --parameters authApiClientId='${{ steps.values.outputs.auth_api_client_id }}' \
            --parameters authWorkbenchClientId='${{ steps.values.outputs.auth_workbench_client_id }}' \
            --parameters authWorkbenchClientSecret='${{ steps.values.outputs.auth_workbench_client_secret }}' \
            --parameters authApiScope='${{ steps.values.outputs.auth_api_scope }}' \
            --parameters authNextAuthSecret='${{ steps.values.outputs.auth_nextauth_secret }}' \
            --parameters authBootstrapAdminEmail='${{ steps.values.outputs.auth_bootstrap_admin_email }}' \
            --parameters authBootstrapAdminObjectId='${{ steps.values.outputs.auth_bootstrap_admin_object_id }}' \
            --parameters workbenchPublicUrl='${{ vars.PROD_WORKBENCH_URL }}' \
            --parameters shopriteBaseUrl='${{ steps.values.outputs.shoprite_base_url }}' \
            --parameters shopriteUsername='${{ steps.values.outputs.shoprite_username }}' \
            --parameters shopritePassword='${{ steps.values.outputs.shoprite_password }}' \
            --parameters shopriteContractId='${{ steps.values.outputs.shoprite_contract_id }}' \
            --parameters shopriteAcknowledgeOrders='${{ vars.PROD_SHOPRITE_ACKNOWLEDGE_ORDERS }}' \
            --parameters shopriteInvoiceSubmissionMode='${{ vars.PROD_SHOPRITE_SUBMISSION_MODE }}' \
            --parameters acumaticaInvoiceSourceMode='${{ vars.PROD_ACUMATICA_SOURCE_MODE }}' \
            --parameters acumaticaInvoiceDateFrom='${{ vars.PROD_ACUMATICA_INVOICE_DATE_FROM }}' \
            --parameters acumaticaUsername='${{ steps.values.outputs.acumatica_username }}' \
            --parameters acumaticaPassword='${{ steps.values.outputs.acumatica_password }}' \
            --parameters acumaticaWebhookSecret='${{ steps.values.outputs.acumatica_webhook_secret }}' \
            --parameters containerAppMinReplicas=1 \
            --only-show-errors

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail
          connection_string="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name connectionstrings--pvm --query value -o tsv)"
          echo "::add-mask::$connection_string"
          export ConnectionStrings__Pvm="$connection_string"
          dotnet run --project backend/src/Pvm.DatabaseMigrator/Pvm.DatabaseMigrator.csproj --configuration Release

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          api_url="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n ca-pvm-api-prod --query "properties.configuration.ingress.fqdn" -o tsv)"
          workbench_url="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n ca-pvm-workbench-prod --query "properties.configuration.ingress.fqdn" -o tsv)"

          retry_status() {
            local url="$1"
            local expected="$2"
            local follow="${3:-false}"
            local status=""
            for _ in {1..18}; do
              if [ "$follow" = "true" ]; then
                status="$(curl --location --show-error --silent --output /dev/null --write-out "%{http_code}" "$url" || true)"
              else
                status="$(curl --show-error --silent --output /dev/null --write-out "%{http_code}" "$url" || true)"
              fi

              if [ "$status" = "$expected" ]; then
                echo "$status"
                return 0
              fi

              sleep 10
            done

            echo "$status"
            return 1
          }

          health_status="$(retry_status "https://$api_url/health" "200")"
          if [ "$health_status" != "200" ]; then
            echo "Expected API health to return 200, got $health_status." >&2
            exit 1
          fi

          candidates_status="$(curl --show-error --silent --output /dev/null --write-out "%{http_code}" "https://$api_url/api/invoices/candidates")"
          if [ "$candidates_status" != "401" ]; then
            echo "Expected anonymous invoice candidates request to return 401, got $candidates_status." >&2
            exit 1
          fi

          webhook_status="$(curl --show-error --silent --output /dev/null --write-out "%{http_code}" \
            --request POST --header "Content-Type: application/json" --data '{}' \
            "https://$api_url/api/webhooks/acumatica/invoice-changes")"
          if [ "$webhook_status" != "401" ]; then
            echo "Expected unauthenticated Acumatica webhook request to return 401, got $webhook_status." >&2
            exit 1
          fi

          workbench_status="$(retry_status "https://$workbench_url/invoices" "200" "true")"
          if [ "$workbench_status" != "200" ]; then
            echo "Expected workbench auth flow to resolve to a 200 sign-in page, got $workbench_status." >&2
            exit 1
          fi

          worker_state="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n ca-pvm-worker-prod --query properties.provisioningState -o tsv)"
          if [ "$worker_state" != "Succeeded" ]; then
            echo "Expected worker provisioning state Succeeded, got $worker_state." >&2
            exit 1
          fi

          echo "API: https://$api_url"
          echo "Workbench: https://$workbench_url"
          echo "Worker: ca-pvm-worker-prod ($worker_state)"
